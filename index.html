<style>
:root{color-scheme:dark;--bg:#101110;--card:#1b1c19;--card2:#22231f;--text:#f6f3e8;--muted:#a7a596;--gold:#e4c63e;--line:#37372f;--shadow:0 18px 55px #0005}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#4d4520 0,transparent 42%),var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;transition:.3s}body.light{--bg:#f5f3ec;--card:#fff;--card2:#f0eee6;--text:#22231e;--muted:#777568;--gold:#b99700;--line:#e5e1d4;--shadow:0 16px 45px #3a32151a;background:radial-gradient(ellipse at 50% -20%,#f7e9a6 0,transparent 45%),var(--bg)}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:510px;margin:auto;padding:20px 18px 30px}.top{display:flex;align-items:center;gap:12px;margin:8px 0 26px}.logo{width:45px;height:45px;border-radius:14px;object-fit:cover;object-position:center;background:#171812;border:1px solid #e4c63e55}.brand{font-size:17px;font-weight:800;letter-spacing:.18em}.tag{font-size:11px;color:var(--muted);letter-spacing:.12em}.tools{margin-left:auto;display:flex;gap:8px}.tool{height:38px;min-width:42px;border:1px solid var(--line);border-radius:13px;background:var(--card);color:var(--text);font-weight:700}.hero{padding:24px 20px;border:1px solid #e4c63e3b;border-radius:26px;background:linear-gradient(145deg,#28271e,var(--card) 64%);box-shadow:var(--shadow);overflow:hidden;position:relative}.light .hero{background:linear-gradient(145deg,#fff9df,var(--card) 72%)}.eyebrow{color:var(--gold);text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:700}.hero h1{font-size:27px;line-height:1.15;margin:9px 0 8px;letter-spacing:-.04em}.hero p{color:var(--muted);margin:0;font-size:14px}.route{display:grid;grid-template-columns:1fr 74px 1fr;align-items:center;margin:28px 0 4px}.place{display:grid;grid-template-columns:31px 1fr;align-items:center;gap:9px}.flag{font-size:22px}.place strong{display:block;font-size:13px}.place small{color:var(--muted);font-size:11px}.place.end{text-align:right;grid-template-columns:1fr 31px}.place.end .flag{grid-column:2}.place.end div{grid-row:1;grid-column:1}.routeway{height:2px;background:var(--line);position:relative;margin:0 8px}.routeway:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--gold);transform-origin:left;animation:draw 1s ease-out both}.routeway:after{content:"✦";position:absolute;color:var(--gold);left:50%;top:50%;font-size:17px;transform:translate(-50%,-54%);animation:float 2s ease-in-out infinite}.form{margin-top:23px}.label{font-size:13px;font-weight:700;margin-bottom:9px;display:block}.inputrow{display:flex;gap:9px}.inputrow input{min-width:0;flex:1;padding:14px;border-radius:15px;border:1px solid var(--line);background:var(--card2);color:var(--text);outline:none}.inputrow input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e4c63e24}.submit{border:0;border-radius:15px;padding:0 17px;background:var(--gold);color:#171710;font-weight:800;transition:transform .2s,filter .2s}.submit:active{transform:scale(.96)}.result{display:none;margin-top:15px;padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--card2);animation:rise .3s ease both}.result.show{display:block}.resulthead{display:flex;justify-content:space-between;gap:8px;font-weight:800}.badge{color:var(--gold);font-size:11px;background:#e4c63e1c;border-radius:99px;padding:4px 9px}.result p{margin:8px 0 0;color:var(--muted);font-size:13px}.locknote{display:flex;gap:10px;align-items:center;padding:14px 15px;border:1px solid var(--line);border-radius:17px;margin-top:14px;color:var(--muted);font-size:12px}.lock{width:20px;height:20px;flex:none;color:var(--gold)}footer{text-align:center;margin-top:27px;padding:18px 0 4px;color:var(--muted);font-size:11px;letter-spacing:.04em;border-top:1px solid var(--line)}footer b{color:var(--text);letter-spacing:.18em;display:block;margin-bottom:5px;font-size:12px}.toast{min-height:19px;color:#d66;font-size:12px;margin-top:8px}.menu{position:absolute;right:18px;top:69px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:6px;box-shadow:var(--shadow);z-index:4;display:none}.menu.open{display:block;animation:rise .18s ease}.langopt{display:block;width:100%;text-align:left;background:none;border:0;color:var(--text);padding:10px 20px;border-radius:10px}.langopt:hover{background:var(--card2)}@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes float{50%{margin-top:-4px}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* Refined controls and route */
.top{position:relative}.logo{width:48px;height:48px;border-radius:14px;object-fit:cover;object-position:center;box-shadow:0 0 0 1px #e4c63e40}.tools{gap:9px}.tool{height:40px;min-width:42px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);font-weight:750;transition:background .2s,border-color .2s,transform .2s}.tool:active{transform:scale(.94)}#langBtn{gap:7px;padding:0 10px;min-width:65px;letter-spacing:.06em}#langBtn .chev{width:10px;height:10px;transition:transform .22s}#langBtn[aria-expanded="true"] .chev{transform:rotate(180deg)}.theme-btn{width:42px;padding:0}.theme-icon{width:20px;height:20px;display:block;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .2s}.theme-btn:active .theme-icon{transform:rotate(35deg) scale(.85)}
.menu{top:58px;right:50px;width:178px;padding:6px;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:17px;transform:translateY(-5px) scale(.97);transform-origin:top right;opacity:0;pointer-events:none;transition:opacity .18s,transform .22s cubic-bezier(.2,.8,.2,1)}.menu.open{display:block;opacity:1;pointer-events:auto;transform:translateY(0) scale(1);animation:none}.langopt{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 11px;font-size:14px;transition:background .18s,color .18s,transform .18s}.langopt:active{transform:scale(.97)}.langopt.active{background:#e4c63e1b;color:var(--gold);font-weight:700}.langopt .lang-check{margin-left:auto;color:var(--gold);opacity:0;transform:scale(.6);transition:.2s}.langopt.active .lang-check{opacity:1;transform:scale(1)}
.route{grid-template-columns:1fr minmax(96px,1.45fr) 1fr}.routeway{height:18px;background:none;margin:0 -4px}.routeway:before{top:8px;left:0;right:0;height:2px;background:var(--line);transform:none;animation:none}.routeway:after{content:none;animation:none}.routeway .line-fill{position:absolute;left:0;right:0;top:8px;height:2px;border-radius:2px;background:var(--gold);transform-origin:left;animation:draw 1.1s .15s cubic-bezier(.2,.7,.2,1) both}.routeway .route-dot{position:absolute;top:50%;width:9px;height:9px;margin-top:-4.5px;border:2px solid var(--gold);border-radius:50%;background:var(--card);z-index:1;box-shadow:0 0 0 3px #e4c63e18}.routeway .route-dot:first-of-type{left:0}.routeway .route-dot:last-of-type{right:0}.routeway .route-dot:last-of-type{animation:dot-in .45s .8s both}.hero{animation:hero-in .5s cubic-bezier(.2,.75,.25,1) both}.form,.locknote,footer{animation:rise .45s .08s both}@keyframes dot-in{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}@keyframes hero-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}/* Full brand lockup and balanced controls */
.top{position:relative;align-items:center;gap:10px}.brand-logo{display:block;flex:0 1 auto;width:min(49vw,174px);height:120px;min-width:126px;object-fit:contain;object-position:center;background:#171812;border:1px solid #e4c63e45;border-radius:16px;box-shadow:0 10px 30px #0002}.tools{flex:0 0 auto;gap:8px}.menu{top:calc(100% + 8px);right:0}.routeway{transform:translateX(-8px);margin:0 3px 0 -3px}/* Text-first brand and live tracking status */
.brand-lockup{min-width:0}.brand{display:flex;gap:7px;align-items:center;font-size:18px;font-weight:850;letter-spacing:.16em;line-height:1.1;color:var(--text)}.brand-accent{color:var(--gold)}.brand-rule{height:2px;width:36px;margin:9px 0 6px;border-radius:2px;background:linear-gradient(90deg,var(--gold),transparent)}.tag{font-size:10px;letter-spacing:.13em}.hero p.hero-sub{display:flex;align-items:flex-start;gap:9px;margin:0 0 0 8px;font-size:14px}.hero-sub .sub-copy{flex:1}.live-dot{position:relative;display:inline-block;flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:#38d996;box-shadow:0 0 10px #38d99685}.live-dot:after{content:"";position:absolute;inset:-4px;border:1px solid #38d9967a;border-radius:50%;animation:live-pulse 1.8s ease-out infinite}@keyframes live-pulse{0%{transform:scale(.65);opacity:.8}85%,100%{transform:scale(1.9);opacity:0}}/* Выравнивание подписи и маршрута */
.hero p.hero-sub {

<body><main class="wrap"><header class="top"><div class="brand-lockup"><div class="brand"><span>PRIMA</span><span class="brand-accent">CARGO</span></div><div class="brand-rule"></div><div class="tag" data-t="tag">ДОСТАВКА ИЗ КИТАЯ</div></div><div class="tools"><button class="tool" id="langBtn" aria-label="Язык" aria-expanded="false">RU</button><button class="tool theme-btn" id="themeBtn" aria-label="Переключить тему"></button></div><div class="menu" id="langMenu" role="menu"><button class="langopt" data-lang="ru" role="menuitem">🇷🇺<span>Русский</span><span class="lang-check">✓</span></button><button class="langopt" data-lang="tg" role="menuitem">🇹🇯<span>Тоҷикӣ</span><span class="lang-check">✓</span></button><button class="langopt" data-lang="en" role="menuitem">🇬🇧<span>English</span><span class="lang-check">✓</span></button><button class="langopt" data-lang="zh" role="menuitem">🇨🇳<span>中文</span><span class="lang-check">✓</span></button></div></header>

<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const codes={ru:'RU',tg:'TJ',en:'EN',zh:'CN'};let lang=localStorage.getItem('pc-lang')||'ru';const words={ru:{tag:'ДОСТАВКА ИЗ КИТАЯ',eyebrow:'В пути вместе с вами',headline:'Ваш заказ<br>под контролем',sub:'<span class="live-dot" aria-hidden="true"></span><span class="sub-copy">Отслеживайте доставку из Китая в Таджикистан</span>',china:'Китай',origin:'Отправление',tajik:'Таджикистан',destination:'Получение',label:'Код заказа',button:'Проверить',statusLabel:'СТАТУС',privacy:'Введите код заказа, чтобы увидеть его текущий статус.',footer:'Доставка из Китая в Таджикистан',placeholder:'Например, PC-10245',loading:'Проверяем заказ…',error:'Заказ не найден. Проверьте код и попробуйте ещё раз.',fail:'Не удалось подключиться. Попробуйте позже.',updated:'Обновлено: ',telegram:'Откройте Mini App через меню Telegram.'},tg:{tag:'ИНТИҚОЛ АЗ ЧИН',eyebrow:'Дар роҳ ҳамроҳи шумо',headline:'Фармоиши шумо<br>зери назорат аст',sub:'<span class="live-dot" aria-hidden="true"></span><span class="sub-copy">Интиқолро аз Чин ба Тоҷикистон пайгирӣ кунед</span>',china:'Чин',origin:'Фиристода шуд',tajik:'Тоҷикистон',destination:'Қабул',label:'Рамзи фармоиш',button:'Санҷидан',statusLabel:'ҲОЛАТ',privacy:'Рамзи фармоишро ворид кунед, то ҳолатро бинед.',footer:'Интиқол аз Чин ба Тоҷикистон',placeholder:'Масалан, PC-10245',loading:'Фармоиш санҷида мешавад…',error:'Фармоиш ёфт нашуд. Рамзро санҷед.',fail:'Пайваст нашуд. Баъдтар кӯшиш кунед.',updated:'Навсозӣ: ',telegram:'Mini App-ро аз менюи Telegram кушоед.'},en:{tag:'DELIVERY FROM CHINA',eyebrow:'On the way with you',headline:'Your order<br>under control',sub:'<span class="live-dot" aria-hidden="true"></span><span class="sub-copy">Track delivery from China to Tajikistan</span>',china:'China',origin:'Origin',tajik:'Tajikistan',destination:'Destination',label:'Order code',button:'Track order',statusLabel:'STATUS',privacy:'Enter your order code to see its current status.',footer:'Delivery from China to Tajikistan',placeholder:'For example, PC-10245',loading:'Checking your order…',error:'Order not found. Check the code and try again.',fail:'Connection failed. Please try again.',updated:'Updated: ',telegram:'Open the Mini App from Telegram menu.'},zh:{tag:'中国货运服务',eyebrow:'一路与您同行',headline:'您的订单<br>尽在掌握',sub:'<span class="live-dot" aria-hidden="true"></span><span class="sub-copy">追踪从中国到塔吉克斯坦的货物</span>',china:'中国',origin:'发货地',tajik:'塔吉克斯坦',destination:'目的地',label:'订单编号',button:'查询订单',statusLabel:'状态',privacy:'输入订单编号以查看当前状态。',footer:'从中国运送至塔吉克斯坦',placeholder:'例如 PC-10245',loading:'正在查询订单…',error:'未找到订单，请检查编号后重试。',fail:'连接失败，请稍后重试。',updated:'更新时间：',telegram:'请从 Telegram 菜单打开 Mini App。'}};
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(el=>{let val=words[lang][el.dataset.t];if(val!==undefined)el.innerHTML=val});document.querySelector('#langBtn').innerHTML='<span>'+codes[lang]+'</span><svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="m2.5 4.5 3.5 3 3.5-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';document.querySelector('#code').placeholder=words[lang].placeholder;document.querySelectorAll('.langopt').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-current',b.dataset.lang===lang?'true':'false')})}
render();const menu=document.querySelector('#langMenu'),langButton=document.querySelector('#langBtn');langButton.onclick=()=>{let open=!menu.classList.contains('open');menu.classList.toggle('open',open);langButton.setAttribute('aria-expanded',String(open))};document.querySelectorAll('.langopt').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('pc-lang',lang);menu.classList.remove('open');langButton.setAttribute('aria-expanded','false');render()});document.addEventListener('click',e=>{if(!e.target.closest('#langBtn')&&!e.target.closest('#langMenu')){menu.classList.remove('open');langButton.setAttribute('aria-expanded','false')}});let theme=localStorage.getItem('pc-theme')||'dark';function setTheme(){document.body.classList.toggle('light',theme==='light');let sun='<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',moon='<svg class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.7 8.7 0 1 0 20.4 15.1Z"/><path d="m16.7 4 .45 1.25L18.4 5.7l-1.25.45-.45 1.25-.45-1.25L15 5.7l1.25-.45Z"/></svg>';document.querySelector('#themeBtn').innerHTML=theme==='light'?moon:sun;document.querySelector('#themeBtn').setAttribute('aria-label',theme==='light'?'Включить тёмную тему':'Включить светлую тему')}setTheme();document.querySelector('#themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('pc-theme',theme);setTheme()};
async function lookup(){let code=document.querySelector('#code').value.trim().toUpperCase(),toast=document.querySelector('#toast'),result=document.querySelector('#result');result.classList.remove('show');if(!code){toast.textContent=words[lang].error;return}toast.textContent=words[lang].loading;try{let r=await fetch('/api/order?code='+encodeURIComponent(code),{headers:{'X-Telegram-Init-Data':tg?.initData||''}}),d=await r.json();if(!r.ok)throw Error(d.detail||'fail');document.querySelector('#orderCode').textContent='📦 '+d.code;document.querySelector('#status').textContent=d.status;document.querySelector('#updated').textContent=words[lang].updated+d.updated_at;result.classList.add('show');toast.textContent=''}catch(e){toast.textContent=e.message==='not_found'?words[lang].error:e.message==='telegram_required'?words[lang].telegram:words[lang].fail}}document.querySelector('#check').onclick=lookup;document.querySelector('#code').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
